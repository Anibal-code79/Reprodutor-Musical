<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODE Music</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <h1>CODE Music</h1>
    <div class="pesquisar">
      <input type="search" id="busca" placeholder="Pesquisa músicas, artistas ou álbuns" aria-label="Pesquisar">
    </div>
  </header>

  <main>
    <div class="caixinhas">
      <div class="box1">Favoritos</div>
      <div class="box2">Minha PlayList</div>
      <div class="box3">Músicas Recentes</div>
    </div>

    <nav>
      <button id="btnMusicas" class="ativo">Músicas</button>
      <button id="btnArtistas">Artistas</button>
      <button id="btnAlbuns">Álbuns</button>
    </nav>

    <section id="musicas">
      <h2 id="tituloLista">Em alta agora</h2>
      <div id="listaMusicas" class="lista"></div>
    </section>
    <section id="artistas" hidden>
      <h2>Artistas</h2>
      <div id="listaArtistas" class="grade"></div>
    </section>
    <section id="albuns" hidden>
      <h2>Álbuns</h2>
      <div id="listaAlbuns" class="grade"></div>
    </section>
  </main>

  <footer class="player">
    <input type="range" id="progresso" value="0" min="0" max="30" step="0.1" aria-label="Progresso">
    <img id="capa" alt="" hidden>
    <div class="info">
      <strong id="titulo">Nenhuma música a tocar</strong>
      <small id="artista">Escolhe uma música da lista</small>
    </div>
    <div class="controlos">
      <button id="btnAnterior" aria-label="Anterior">⏮</button>
      <button id="btnPlay" class="play" aria-label="Tocar">▶</button>
      <button id="btnProxima" aria-label="Seguinte">⏭</button>
    </div>
    <audio id="audio"></audio>
  </footer>

  <script src="inter.js"></script>
</body>
</html>
